services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: '${POSTGRES_USER:?POSTGRES_USER is required}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}'
      POSTGRES_DB: '${POSTGRES_DB:?POSTGRES_DB is required}'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      MINIO_ROOT_USER: '${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}'
      MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - minio-data:/data
    ports:
      - '${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_PORT:-9000}:9000'

volumes:
  postgres-data:
    external: true
    name: '${POSTGRES_DATA_VOLUME:?POSTGRES_DATA_VOLUME is required}'
  minio-data:
    external: true
    name: '${MINIO_DATA_VOLUME:?MINIO_DATA_VOLUME is required}'

networks:
  default:
    external: true
    name: '${NEWSLETTER_INTERNAL_NETWORK:?NEWSLETTER_INTERNAL_NETWORK is required}'
