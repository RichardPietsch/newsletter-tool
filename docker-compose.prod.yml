x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: '${DATABASE_URL:?DATABASE_URL is required}'
  APP_URL: '${APP_URL:?APP_URL is required}'
  AUTH_COOKIE_NAME: '${AUTH_COOKIE_NAME:-newsletter_session}'
  AUTH_MAGIC_LINK_TTL_MINUTES: '${AUTH_MAGIC_LINK_TTL_MINUTES:-10}'
  AUTH_SESSION_DAYS: '${AUTH_SESSION_DAYS:-30}'
  AUTH_SESSION_IDLE_HOURS: '${AUTH_SESSION_IDLE_HOURS:-12}'
  AUTH_RATE_LIMIT_SECRET: '${AUTH_RATE_LIMIT_SECRET:?AUTH_RATE_LIMIT_SECRET is required}'
  SMTP_HOST: '${SMTP_HOST:?SMTP_HOST is required}'
  SMTP_PORT: '${SMTP_PORT:-587}'
  SMTP_USER: '${SMTP_USER:?SMTP_USER is required}'
  SMTP_PASSWORD: '${SMTP_PASSWORD:?SMTP_PASSWORD is required}'
  SMTP_FROM: '${SMTP_FROM:?SMTP_FROM is required}'
  S3_ENDPOINT: http://minio:9000
  S3_REGION: '${S3_REGION:-us-east-1}'
  S3_ACCESS_KEY_ID: '${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}'
  S3_SECRET_ACCESS_KEY: '${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}'
  S3_BUCKET: '${S3_BUCKET:?S3_BUCKET is required}'
  PUBLIC_ASSET_BASE_URL: '${PUBLIC_ASSET_BASE_URL:?PUBLIC_ASSET_BASE_URL is required}'

x-app-service: &app-service
  image: '${APP_IMAGE:-newsletter-tool:production}'
  build:
    context: .
    target: production
  environment: *app-environment

services:
  createbucket:
    image: minio/mc:latest
    environment:
      MINIO_ROOT_USER: '${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}'
      MINIO_ROOT_PASSWORD: '${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}'
      S3_BUCKET: '${S3_BUCKET:?S3_BUCKET is required}'
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        mc anonymous set download "local/$${S3_BUCKET}"

  migrate:
    <<: *app-service
    command: ./node_modules/.bin/tsx scripts/migrate.ts
    restart: 'no'

  bootstrap-admin:
    <<: *app-service
    environment:
      <<: *app-environment
      BOOTSTRAP_ADMIN_EMAIL: '${BOOTSTRAP_ADMIN_EMAIL:-}'
      BOOTSTRAP_ADMIN_NAME: '${BOOTSTRAP_ADMIN_NAME:-Installation Owner}'
    command: ./node_modules/.bin/tsx scripts/bootstrap-admin-env.ts
    restart: 'no'

  web:
    <<: *app-service
    command: ./node_modules/.bin/next start
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000'
    expose:
      - '3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  audit-cleanup:
    <<: *app-service
    command: sh scripts/run-audit-cleanup.sh
    restart: unless-stopped
    stop_grace_period: 30s

networks:
  default:
    external: true
    name: '${NEWSLETTER_INTERNAL_NETWORK:?NEWSLETTER_INTERNAL_NETWORK is required}'
